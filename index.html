<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>壢商校友線上回娘家</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column like a 畢業紀念冊 page; every step is one card; the map screen widens to two panes on desktop. */
:root{
  --paper:#f5f6ec;          /* page ground, faint green-tinted paper */
  --card:#ffffff;
  --ink:#1c2a1f;            /* body text */
  --ink-soft:#4f5f52;
  --line:#dfe3d2;
  --green:#0d5a23;          /* 校徽綠 */
  --green-ink:#0b4a1d;
  --green-wash:#e3eedb;
  --yellow:#f1df45;         /* 校徽黃 */
  --yellow-wash:#fbf5c8;
  --gold:#7a6a1c;           /* 校徽外環金 */
  --seal:#b8322a;           /* 篆字紅，用於「屆」印章 */
  --ok:#1f7a3a; --ok-wash:#e2f2e5;
  --bad:#a8432c; --bad-wash:#f8e6df;
  --ring-0:#0d5a23; --ring-1:#4f9a55; --ring-2:#8cc47f; --ring-3:#c3dfb6;
  --map-0:#e8eadf; --map-1:#cfe3c3; --map-2:#9fcb8c; --map-3:#5fa45a; --map-4:#2f7d39; --map-5:#0d5a23;
  --font-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121a14; --card:#1b251d; --ink:#edf1e6; --ink-soft:#b3bfb1; --line:#2e3b30;
  --green:#7cc68a; --green-ink:#a5dcae; --green-wash:#21352a; --yellow:#efd93f; --yellow-wash:#353216;
  --gold:#cbb75a; --seal:#ef7b6f; --ok:#79cf8e; --ok-wash:#1f3527; --bad:#f19a80; --bad-wash:#3a2420;
  --map-0:#26302a; --map-1:#2c4a33; --map-2:#3b6b44; --map-3:#4f9257; --map-4:#71b878; --map-5:#a3dca5;
  --ring-0:#b5e6b5; --ring-1:#74b878; --ring-2:#477f4d; --ring-3:#2e4d35;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121a14; --card:#1b251d; --ink:#edf1e6; --ink-soft:#b3bfb1; --line:#2e3b30;
  --green:#7cc68a; --green-ink:#a5dcae; --green-wash:#21352a; --yellow:#efd93f; --yellow-wash:#353216;
  --gold:#cbb75a; --seal:#ef7b6f; --ok:#79cf8e; --ok-wash:#1f3527; --bad:#f19a80; --bad-wash:#3a2420;
  --map-0:#26302a; --map-1:#2c4a33; --map-2:#3b6b44; --map-3:#4f9257; --map-4:#71b878; --map-5:#a3dca5;
  --ring-0:#b5e6b5; --ring-1:#74b878; --ring-2:#477f4d; --ring-3:#2e4d35;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font-body);font-size:18px;line-height:1.65;margin:0;-webkit-text-size-adjust:100%}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1080px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,7vw,44px);color:var(--green-ink)}
h2{font-size:clamp(24px,5.4vw,30px);color:var(--green-ink)}
h3{font-size:21px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.topbar img{width:40px;height:40px}
.topbar .name{white-space:nowrap;font-family:var(--font-display);font-size:19px;color:var(--green-ink);line-height:1.2}
.topbar .name small{display:block;font-family:var(--font-body);font-size:13px;color:var(--ink-soft);letter-spacing:.06em}
.progress{margin-left:auto;display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:50%}
.progress i{display:block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.progress i.on{background:var(--green)}
.progress i.now{background:var(--yellow);box-shadow:0 0 0 2px var(--green)}

.card{background:var(--card);border-radius:var(--r);padding:28px 24px;box-shadow:0 1px 0 var(--line),0 8px 28px -18px rgba(13,90,35,.35);display:flex;flex-direction:column;gap:18px;animation:rise .35s ease both}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-size:14px;letter-spacing:.12em;color:var(--gold);font-weight:700}
.lead{color:var(--ink-soft)}
.btn{appearance:none;border:0;border-radius:999px;padding:14px 26px;font-weight:700;font-size:18px;cursor:pointer;background:var(--green);color:var(--card);min-height:52px;transition:transform .12s}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--green-ink);box-shadow:inset 0 0 0 2px var(--green)}
.btn.yellow{background:var(--yellow);color:#1c2a1f}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.emailbox{display:flex;flex-direction:column;gap:14px}
.sendrow{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sendrow .hint{text-align:right;max-width:30em}
.backlink{appearance:none;background:none;border:0;padding:10px 4px;font-size:15px;color:var(--ink-soft);cursor:pointer;min-height:44px}
.backlink:hover{color:var(--green-ink);text-decoration:underline;text-underline-offset:4px}
.btn.back{padding:12px 18px;font-size:16px;min-height:48px;font-weight:500}
.fact .btn.back{background:transparent;color:#f5f6ec;box-shadow:inset 0 0 0 2px rgba(245,246,236,.6)}
.photo{margin:0;display:flex;flex-direction:column;gap:6px}
.photo img{width:100%;max-width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;display:block;background:var(--green-wash)}
.photo.contain img{object-fit:contain;aspect-ratio:16/9;background:var(--card)}
.eras{display:flex;flex-wrap:wrap;gap:6px}
.eras button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:36px;font-variant-numeric:tabular-nums}
.eras button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--card)}
.fact .eras button{background:transparent;border-color:rgba(245,246,236,.5);color:#f5f6ec}
.fact .eras button[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#1c2a1f}
.photo figcaption{font-size:14px;color:var(--ink-soft)}
.fact .photo figcaption{color:#dfe7d6}
.summary{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.summary li{display:grid;grid-template-columns:6.5em minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.summary .k{color:var(--ink-soft);font-size:15px}
.summary .v{min-width:0;overflow-wrap:anywhere}
.summary button{appearance:none;border:0;background:var(--green-wash);color:var(--green-ink);border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;min-height:40px}
.linkbtn{background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:8px 4px;font-size:16px}

/* welcome */
.hero{align-items:center;text-align:center;gap:16px;padding-block:36px}
.hero img{width:150px;height:150px}
.subtitle{font-family:var(--font-display);font-size:22px;color:var(--gold);margin-top:-6px}
.helpbox{background:var(--yellow-wash);border-radius:12px;padding:12px 14px;font-size:16px;text-align:left}
.helpbox a,.lead a{color:var(--green-ink);font-weight:700}
.mail{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mail li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--green-wash);border-radius:12px;padding:12px 16px}
.mail span{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.promise{display:block;font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--green-ink);margin-bottom:4px}
.hero .count{font-size:16px;color:var(--ink-soft)}
.hero .count b{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--green-ink);font-variant-numeric:tabular-nums}

/* options */
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;cursor:pointer;min-height:56px;display:flex;align-items:center;gap:12px;font-size:18px}
.opt:hover{border-color:var(--green)}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-wash)}
.opt.right{border-color:var(--ok);background:var(--ok-wash)}
.opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.opt[disabled]{cursor:default}
.opt .mark{margin-left:auto;font-weight:700;font-size:15px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{appearance:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;cursor:pointer;font-size:17px;min-height:46px}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:var(--card)}
.chip.right{border-color:var(--ok);background:var(--ok-wash);color:var(--ink)}
.chip.wrong{border-color:var(--bad);background:var(--bad-wash);color:var(--ink);text-decoration:line-through}
.chip.missed{border-style:dashed;border-color:var(--ok)}
.feedback{border-radius:14px;padding:14px 16px;background:var(--yellow-wash);display:flex;flex-direction:column;gap:6px}
.feedback b{font-family:var(--font-display);font-weight:400;font-size:21px}
.feedback.good b{color:var(--ok)}
.feedback.bad b{color:var(--bad)}
.feedback.reply b{font-family:var(--font-body);font-weight:500;font-size:18px;color:var(--green-ink);line-height:1.7}
.feedback small{color:var(--ink-soft);font-size:15px;line-height:1.6}
.qcount{font-size:15px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.score{display:flex;gap:8px}
.score i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;border:2px solid var(--line);color:var(--ink-soft)}
.score i.ok{background:var(--ok);border-color:var(--ok);color:var(--card)}
.score i.no{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}

/* year picker */
.yearbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:2px solid var(--line);border-radius:16px;overflow:hidden}
.stepper button{appearance:none;border:0;background:var(--green-wash);width:56px;height:64px;font-size:28px;cursor:pointer;color:var(--green-ink)}
.stepper select{appearance:none;border:0;background:var(--card);height:64px;padding:0 14px;font-family:var(--font-display);font-size:30px;text-align:center;min-width:130px;cursor:pointer}
.ad{color:var(--ink-soft);font-size:16px}
.seal{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--seal);color:var(--seal);border-radius:8px;padding:6px 12px;font-family:var(--font-display);line-height:1.1;transform:rotate(-4deg);background:var(--card);min-width:84px}
.seal span{font-size:13px;letter-spacing:.2em}
.seal b{font-weight:400;font-size:30px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sealrow{display:flex;gap:16px;align-items:center}

/* fact card */
.fact{background:var(--green);color:#f5f6ec;position:relative;overflow:hidden}
.fact h2{color:var(--yellow)}
.fact .eyebrow{color:#f1df45;opacity:.9}
.fact p{color:#eef2e6}
.fact .when{display:inline-block;background:var(--yellow);color:#1c2a1f;border-radius:6px;padding:2px 10px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;align-self:flex-start}
.fact .btn{background:var(--yellow);color:#1c2a1f;align-self:flex-end}
.fact::after{content:"壢";position:absolute;right:-14px;bottom:-46px;font-family:var(--font-display);font-size:200px;line-height:1;color:rgba(255,255,255,.07);pointer-events:none}
:root[data-theme="dark"] .fact{background:#16361f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fact{background:#16361f}}

/* region picker */
.seg{display:inline-flex;border:2px solid var(--green);border-radius:999px;overflow:hidden;align-self:flex-start}
.seg button{appearance:none;border:0;background:transparent;padding:10px 20px;cursor:pointer;font-size:17px;color:var(--green-ink);min-height:46px}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--card)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500}
.field input[type=email],.field input[type=text],.field select,.field textarea{border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);font-size:18px;width:100%;min-height:52px}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);outline:none}
.hint{font-size:15px;color:var(--ink-soft)}
.err{font-size:15px;color:var(--bad)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink-soft);line-height:1.6}
.consent input{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:none}

/* map screen */
.mapgrid{display:grid;gap:16px}
@media (min-width:900px){.mapgrid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.tile b{display:block;font-family:var(--font-display);font-weight:400;font-size:28px;color:var(--green-ink);font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:14px;color:var(--ink-soft)}
.mapcard{padding:16px;gap:12px}
.mapsvg{width:100%;height:auto;display:block;touch-action:manipulation}
.mapsvg .rg{stroke:var(--card);stroke-width:1.2;cursor:pointer;transition:fill .2s}
.mapsvg .rg:hover,.mapsvg .rg.sel{stroke:var(--ink);stroke-width:2}
.mapsvg .land{fill:var(--map-0);stroke:var(--card);stroke-width:.4}
.mapsvg .land.has{fill:var(--map-2);cursor:pointer}
.mapsvg .land.has:hover,.mapsvg .land.sel{fill:var(--map-3)}
.mapsvg .bub{fill:var(--yellow);stroke:var(--green-ink);stroke-width:1.2;cursor:pointer;fill-opacity:.9}
.mapsvg .bub.sel{stroke-width:3}
.mapsvg .ring{cursor:pointer}
.mapsvg .ring circle{stroke:var(--card);stroke-width:1.2}
.mapsvg .ring.sel circle:first-child,.mapsvg .ring:hover circle:first-child{stroke:var(--ink);stroke-width:2}
.mapsvg .rg.faint{fill:var(--map-0)}
.mapsvg .rg.faint.has{fill:var(--map-0)}
.mapsvg .me{fill:none;stroke:var(--seal);stroke-width:3}
.mapsvg .inset{fill:none;stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:4 3}
.mapsvg .lbl{font-size:10px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--card);stroke-width:3px;font-family:var(--font-body)}
.ping{animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
.mapfoot{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
.mini button{appearance:none;border:0;background:none;padding:6px 2px;font-size:13px;color:var(--ink-soft);cursor:pointer;min-height:32px}
.mini button[aria-pressed="true"]{color:var(--green-ink);font-weight:700;text-decoration:underline;text-underline-offset:4px}
.legend{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
.legend i{width:22px;height:12px;border-radius:3px;display:inline-block}
.info{gap:14px}
.info .big{font-family:var(--font-display);font-size:40px;color:var(--green-ink);line-height:1;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2.6em;gap:8px;align-items:center;font-size:15px}
.bar .t{height:12px;background:var(--green-wash);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--green);border-radius:6px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.bar .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--gold)}
.demo{margin-top:20px;font-size:14px;color:var(--ink-soft);background:var(--yellow-wash);border-radius:12px;padding:10px 14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.list{margin:0;padding-left:1.2em;font-size:16px;color:var(--ink-soft)}
.list li{margin:2px 0}
/* 制服伸展台 */
.rw-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rw-mute{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;flex:none}
.rack{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ucard{appearance:none;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;color:var(--ink);transition:transform .15s}
.ucard:hover{transform:translateY(-2px)}
.ucard[aria-pressed="true"]{border-color:var(--green);background:var(--card);box-shadow:0 0 0 2px var(--green)}
.ucard .thumb{width:100%;aspect-ratio:1/1;border-radius:9px;background-color:#fbfaf3;background-repeat:no-repeat;background-size:185% auto;background-position:50% 30%}
.ucard span{font-size:14px;font-weight:700;line-height:1.3;text-align:center}
.rstage{position:relative;border-radius:16px;overflow:hidden;width:100%;max-width:520px;margin:0 auto;aspect-ratio:4/3.4;background-color:#efe9d8;transition:background-color .5s;display:flex;align-items:flex-end;justify-content:center}
.rstage::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 45% at 25% 30%,rgba(255,255,255,.55),transparent 70%),radial-gradient(ellipse 55% 40% at 80% 75%,rgba(255,255,255,.35),transparent 70%)}
.rstage .who{position:relative;height:96%;aspect-ratio:3/4;max-width:100%}
.rstage .who img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.rstage .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:21px;color:#5b6b5d;text-align:center;padding:20px}
.shutter{position:absolute;inset:0;pointer-events:none;z-index:5;animation:flashw .42s ease-out forwards}
@keyframes flashw{0%{background:rgba(255,255,255,0)}25%{background:rgba(255,255,255,.92)}100%{background:rgba(255,255,255,0)}}
.finder{position:absolute;inset:7%;pointer-events:none;z-index:6;animation:finder .5s ease-out forwards;--fc:rgba(31,51,36,.75);background:
 linear-gradient(var(--fc),var(--fc)) left top/26px 3px no-repeat,linear-gradient(var(--fc),var(--fc)) left top/3px 26px no-repeat,
 linear-gradient(var(--fc),var(--fc)) right top/26px 3px no-repeat,linear-gradient(var(--fc),var(--fc)) right top/3px 26px no-repeat,
 linear-gradient(var(--fc),var(--fc)) left bottom/26px 3px no-repeat,linear-gradient(var(--fc),var(--fc)) left bottom/3px 26px no-repeat,
 linear-gradient(var(--fc),var(--fc)) right bottom/26px 3px no-repeat,linear-gradient(var(--fc),var(--fc)) right bottom/3px 26px no-repeat}
@keyframes finder{0%{opacity:0;transform:scale(1.06)}30%{opacity:1;transform:scale(1)}100%{opacity:0}}
.rshake{animation:rshake .5s linear 2}
@keyframes rshake{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.sweat{position:absolute;z-index:4;font-size:clamp(22px,5vw,34px);animation:bob .5s ease-in-out infinite alternate;pointer-events:none}
@keyframes bob{to{transform:translateY(-6px)}}
.alarm{position:absolute;inset:0;background:rgba(200,50,43,.16);animation:flash .3s steps(2) infinite;pointer-events:none}
@keyframes flash{50%{background:rgba(200,50,43,0)}}
.bigstamp{position:absolute;left:50%;top:38%;z-index:3;transform:translate(-50%,-50%) rotate(-8deg);background:rgba(255,253,247,.95);border:4px solid #c8322b;color:#c8322b;border-radius:10px;padding:10px 18px;text-align:center;font-family:var(--font-display);width:min(86%,360px);animation:slam .35s cubic-bezier(.2,1.8,.4,1)}
.bigstamp b{display:block;font-weight:400;font-size:clamp(24px,6vw,32px);line-height:1.2}
.bigstamp span{display:block;font-size:clamp(15px,3.6vw,17px);color:#5b2a26;margin-top:4px;line-height:1.5}
@keyframes slam{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(2.2);opacity:0}100%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}}
.rvariant{display:flex;gap:8px;justify-content:center}
.rvariant button{appearance:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 16px;font-size:15px;cursor:pointer}
.rvariant button[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:var(--card)}
.memo{min-height:50px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;text-align:center}
.memo .note{font-family:var(--font-display);font-size:20px;color:var(--ink);background:var(--yellow-wash);padding:6px 16px;border-radius:4px;transform:rotate(-1deg)}
.memo .tag{font-size:14px;font-weight:700;color:var(--green-ink);border:1.5px solid var(--green);border-radius:999px;padding:2px 10px}
.phr span{display:inline-block}
.keep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.keep img{width:100%;border-radius:12px;box-shadow:0 10px 30px -16px rgba(0,0,0,.45);background:#fbf8ef}
.keep .form{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:720px){.keep{grid-template-columns:1fr}}
@media (max-width:640px){
  .rack{display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x proximity;padding:2px 2px 6px;margin:0 -2px}
  .ucard{flex:0 0 84px;scroll-snap-align:start}
  .ucard span{font-size:13px}
  .rstage{aspect-ratio:auto;height:min(50vh,88vw)}
  .memo .note{font-size:18px;padding:4px 12px}
}
@media (prefers-reduced-motion:reduce){.shutter,.finder,.rshake,.sweat,.alarm,.bigstamp{animation:none!important}}
@media (max-width:420px){.progress{gap:3px}.progress i{width:7px;height:7px}.card{padding:22px 18px}.tile b{font-size:23px}.bar{grid-template-columns:6em minmax(0,1fr) 2.4em}}
</style>
</head>

function demoRows(){
  let s=20240915; const rnd=()=>{s=(s*1103515245+12345)%2147483648;return s/2147483648};

/* ---------- 入場測驗 ---------- */
function buildQuestion(def){
  if(def.type==='principals'){
    const names = shuffle(CONFIG.PRINCIPALS.map(p=>p[0]).concat(CONFIG.DECOY_PRINCIPALS));
    return { kind:'multi', q:'下面哪幾位當過壢商的校長？', sub:'選出你記得的就好，選一位也可以。只要別選到沒當過壢商校長的人喔！', options:names };
  }
  if(def.type==='abbr'){
    return { kind:'single', q:def.q, options:shuffle(['CLVSC','ZLCHS','CLHS','TYCVS']), answer:['CLVSC','ZLCHS'], note:def.note };
  }
  return { kind:'single', q:def.q, options:shuffle(def.options), answer:[def.answer], note:fill(def.note), photo:def.photo };
}
function startQuiz(){
  const bank = CONFIG.QUIZ_BANK.slice();
  const song = window.LS_SONG;   // 來自 song.js（可有可無）
  if(song && song.q && Array.isArray(song.options) && song.options.includes(song.answer)) bank.push(Object.assign({id:'song'}, song));
  const defs = shuffle(bank).slice(0, CONFIG.QUIZ_DRAW);
  S.quiz = { qs: defs.map(buildQuestion), idx:0, results:[] };
  quizQ();
}
function scoreDots(){
  const q=S.quiz; return `<div class="score" aria-label="目前答對 ${q.results.filter(Boolean).length} 題">${q.qs.map((_,i)=>{const r=q.results[i];return `<i class="${r===true?'ok':r===false?'no':''}">${r===true?'✓':r===false?'✕':i+1}</i>`}).join('')}</div>`;
}
function quizQ(){
  const q=S.quiz, cur=q.qs[q.idx];
  setProgress(null);
  let body='';
  if(cur.kind==='single'){
    body=`<div class="opts" id="opts">${cur.options.map((o,i)=>`<button class="opt" data-v="${esc(o)}" id="opt${i}">${esc(o)}<span class="mark"></span></button>`).join('')}</div>`;
  } else {
    body=`<p class="hint">${cur.sub}</p><div class="chips" id="opts">${cur.options.map((o,i)=>`<button class="chip" aria-pressed="false" data-v="${esc(o)}" id="opt${i}">${esc(o)}</button>`).join('')}</div>
    <div class="row end"><button class="btn" id="confirm" disabled>確定</button></div>`;
  }
  show(`<section class="card">
    <div class="row" style="justify-content:space-between"><span class="qcount">一起回憶　第 ${q.idx+1} / ${q.qs.length} 題</span>${scoreDots()}</div>
    <h2>${esc(cur.q)}</h2>${body}<div id="fb"></div>
  </section>`);
  const opts=[...stage.querySelectorAll('#opts button')];
  if(cur.kind==='single'){
    opts.forEach(b=>b.onclick=()=>{
      const ok = cur.answer.includes(b.dataset.v);
      opts.forEach(x=>{ x.disabled=true; if(cur.answer.includes(x.dataset.v)){x.classList.add('right');x.querySelector('.mark').textContent='正確答案'} });
      if(!ok){ b.classList.add('wrong'); b.querySelector('.mark').textContent='你的答案'; }
      answer(ok, cur.note, false, cur.photo);
    });
  } else {
    const conf=$('#confirm');
    opts.forEach(b=>b.onclick=()=>{ b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')==='true'?'false':'true'); conf.disabled=!opts.some(x=>x.getAttribute('aria-pressed')==='true'); });
    conf.onclick=()=>{
      const real=new Set(CONFIG.PRINCIPALS.map(p=>p[0]));
      const chosen=opts.filter(x=>x.getAttribute('aria-pressed')==='true').map(x=>x.dataset.v);
      const wrongs=chosen.filter(n=>!real.has(n));
      const ok = chosen.length>0 && wrongs.length===0;
      opts.forEach(x=>{ x.disabled=true; const v=x.dataset.v, sel=x.getAttribute('aria-pressed')==='true';
        x.setAttribute('aria-pressed','false');
        if(real.has(v)) x.classList.add(sel?'right':'missed'); else if(sel) x.classList.add('wrong'); });
      conf.remove();
      const list = CONFIG.PRINCIPALS.map(p=>`<li>${p[0]}　${p[1]}</li>`).join('');
      const note = (wrongs.length? `「${wrongs.join('、')}」沒有當過壢商校長喔。` : '') + `壢商歷任校長：<ul class="list">${list}</ul>`;
      answer(ok, note, true);
    };
  }
}
function answer(ok, note, rawNote, photo){
  const q=S.quiz; q.results[q.idx]=ok;
  const last = q.idx===q.qs.length-1;
  const right = q.results.filter(Boolean).length, wrong=q.results.filter(r=>r===false).length;
  const early = right>=CONFIG.QUIZ_PASS || wrong > q.qs.length-CONFIG.QUIZ_PASS;
  $('#fb').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?pick(CONFIG.CHEERS_OK):pick(CONFIG.CHEERS_NO)}</b>${note?`<small>${rawNote?note:esc(note)}</small>`:''}${photoHTML(photo)}</div>
    <div class="row end" style="margin-top:14px"><button class="btn" id="next">${last||early?'看結果':'下一題'}</button></div>`;
  stage.querySelector('.score').outerHTML=scoreDots();
  if(!ok) stage.querySelector('.card').classList.add('shake');
  $('#next').onclick=()=>{ if(last||early) quizResult(); else { q.idx++; quizQ(); } };
  $('#next').focus({preventScroll:true});
}

/* ---------- 制服伸展台 ---------- */
const UNI = id => CONFIG.UNIFORMS.find(u=>u.id===id);
const uniImg = (u,v=0) => (window.LS_UNIFORMS||{})[u.img[v]||u.img[0]] || '';
let AC=null, MUTED = (()=>{ try{ return localStorage.getItem('lsMute')!=='0'; }catch(e){ return true; } })();   // 預設關閉音效
function ac(){ if(MUTED) return null; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function tone(f,t0,dur,type='sine',vol=.2,f2){ const a=ac(); if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,a.currentTime+t0); if(f2) o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+t0+dur); g.gain.setValueAtTime(vol,a.currentTime+t0); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+dur); o.connect(g).connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+dur+.02); }
function noise(t0,dur,vol=.25){ const a=ac(); if(!a) return; const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=1800; s.buffer=b; g.gain.value=vol; s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime+t0); }
const SFX = {
  snap(){ noise(0,.035,.4); tone(1400,0,.03,'square',.05); noise(.085,.05,.3); tone(180,.085,.08,'triangle',.18,90); },   // 相機快門
  alarm(){ for(let i=0;i<6;i++) tone(i%2?660:990,i*.16,.13,'square',.07); },
  tada(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28,'triangle',.16)); }
};
let RW_BUSY=false;
function runway(){
  setProgress(null);
  const back = S.editing;
  show(`<section class="card" style="gap:14px">
    <div class="rw-head"><div><p class="eyebrow">時光伸展台</p><h2>你當年穿的是哪一套？</h2></div><button class="rw-mute" id="mute"></button></div>
    <p class="hint" style="margin-top:-6px">點一套你穿過的制服，想穿別的年代也可以。</p>
    <div class="rack" role="group" aria-label="制服">${CONFIG.UNIFORMS.map(u=>`<button class="ucard" data-id="${u.id}" aria-pressed="false"><span class="thumb" style="background-image:url(${uniImg(u)})"></span><span>${esc(u.name)}</span></button>`).join('')}</div>
    <div class="rstage" id="rstage"><div class="who" id="who"></div><div class="empty" id="rempty">從上面挑一套，幫學長姐換上吧！</div></div>
    <div class="rvariant" id="rvariant" hidden></div>
    <div class="memo" id="memo"></div>
    <div class="row" style="justify-content:space-between">${back?'<button class="backlink" id="rwBack">‹ 取消修改</button>':'<button class="linkbtn" id="rwSkip">先跳過</button>'}<button class="btn" id="rwOk" disabled>${back?'改好了':'就是這套！'}</button></div>
  </section>`);
  const mb=$('#mute'), setMute=()=>{ mb.textContent=MUTED?'🔇 音效關':'🔊 音效開'; mb.setAttribute('aria-pressed',String(MUTED)); };
  mb.onclick=()=>{ MUTED=!MUTED; try{ localStorage.setItem('lsMute',MUTED?'1':'0'); }catch(e){} setMute(); if(!MUTED) SFX.snap(); }; setMute();
  stage.querySelectorAll('.ucard').forEach(b=>b.onclick=()=>chooseUni(b.dataset.id));
  const done=()=>{ if(back){ S.editing=false; S.step=FLOW.indexOf('confirm'); } else S.step=0; flow(); };
  $('#rwOk').onclick=()=>{ SFX.tada(); done(); };
  if(back) $('#rwBack').onclick=()=>{ S.editing=false; S.step=FLOW.indexOf('confirm'); flow(); };
  else $('#rwSkip').onclick=()=>{ S.p.uniform=null; done(); };
  if(S.p.uniform) showUni(S.p.uniform,false);
}
function keepStage(){ const r=$('#rstage').getBoundingClientRect(); if(r.top<0||r.bottom>innerHeight) $('#rstage').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
function showUni(id, anim=true){
  const u=UNI(id), v=u.spy?0:S.p.uvar, st=$('#rstage'), who=$('#who');
  st.style.backgroundColor=u.bg; $('#rempty').hidden=true;
  const put=()=>{ who.innerHTML=`<img alt="${esc(u.name)}的男女生制服插畫" src="${uniImg(u,v)}">`; };
  if(anim){ st.querySelectorAll('.shutter,.finder').forEach(e=>e.remove()); st.insertAdjacentHTML('beforeend','<div class="shutter"></div><div class="finder"></div>');
    setTimeout(put,100); setTimeout(()=>st.querySelectorAll('.shutter,.finder').forEach(e=>e.remove()),560); } else put();
  stage.querySelectorAll('.ucard').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));
  const vr=$('#rvariant');
  if(u.variants){ vr.hidden=false; vr.innerHTML=u.variants.map((n,i)=>`<button data-i="${i}" aria-pressed="${i===S.p.uvar}">${n}</button>`).join('');
    vr.querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.p.uvar=+b.dataset.i; SFX.snap(); showUni(id); }); }
  else { vr.hidden=true; vr.innerHTML=''; }
  $('#memo').innerHTML = u.spy?'' : `${u.tag?`<span class="tag">${u.tag}</span>`:''}<span class="note">${esc(u.memo)}</span>`;
  $('#rwOk').disabled = !!u.spy;
}
function chooseUni(id){
  if(RW_BUSY) return;
  const u=UNI(id);
  if(u.spy) return spyUni();
  if(id!==S.p.uniform) S.p.uvar=0;
  S.p.uniform=id; SFX.snap(); showUni(id); keepStage();
}
// 粉紅家商彩蛋：警報、冒汗、蓋章，再換回原本那套
function spyUni(){
  RW_BUSY=true; const prev=S.p.uniform; keepStage();
  showUni('pink'); SFX.alarm();
  const st=$('#rstage'), who=$('#who');
  setTimeout(()=>who.insertAdjacentHTML('beforeend','<span class="sweat" style="left:22%;top:4%">💦❓</span><span class="sweat" style="left:62%;top:0%">💦❓</span>'),130);
  st.insertAdjacentHTML('beforeend','<div class="alarm"></div><div class="bigstamp"><b>咦？走錯棚囉！</b><span>這套是隔壁中壢家商的制服喔～<br>我們幫你換回壢商的！</span></div>');
  st.classList.add('rshake');
  setTimeout(()=>{
    st.classList.remove('rshake'); st.querySelectorAll('.alarm,.bigstamp').forEach(e=>e.remove()); RW_BUSY=false;
    if(prev){ SFX.snap(); showUni(prev); }
    else { who.innerHTML=''; $('#rempty').hidden=false; st.style.backgroundColor=''; $('#memo').innerHTML=''; $('#rwOk').disabled=true; $('#rvariant').hidden=true;
      stage.querySelectorAll('.ucard').forEach(b=>b.setAttribute('aria-pressed','false')); }
  },2600);
}
// 學年度鋼印：像證書上的壓印，不上墨，只用亮面、暗面做出凹凸感，帶一層很淡的金色；學年度跟著開放期間自動換
function drawSeal(g, cx, cy, R, season){
  const body='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  const c=document.createElement('canvas'); c.width=c.height=Math.ceil(R*2+24); const k=c.getContext('2d'), o=c.width/2;
  k.fillStyle=k.strokeStyle='#000'; k.textAlign='center'; k.textBaseline='middle';
  const arc=(text,r,top,step)=>{ const ch=[...text], tot=step*(ch.length-1);
    ch.forEach((t,i)=>{ const a=top? -Math.PI/2-tot/2+i*step : Math.PI/2+tot/2-i*step;
      k.save(); k.translate(o+Math.cos(a)*r,o+Math.sin(a)*r); k.rotate(top? a+Math.PI/2 : a-Math.PI/2); k.fillText(t,0,0); k.restore(); }); };
  k.lineWidth=R*.05; k.beginPath(); k.arc(o,o,R*.96,0,7); k.stroke();
  k.lineWidth=R*.022; k.beginPath(); k.arc(o,o,R*.66,0,7); k.stroke();
  k.font=`700 ${R*.16}px ${body}`; arc('壢商校友線上回娘家',R*.81,true,.29); arc('紀念',R*.81,false,.42);

function keepsakeHTML(){
  return `<div class="card" style="gap:12px" id="keepCard">
    <div class="keep"><img id="keepImg" alt="回娘家紀念圖">
      <div class="form">
        <p class="eyebrow">時光伸展台</p>
        <h3>你的回娘家紀念圖</h3>
        <div class="field"><label for="nick">想留個暱稱嗎？（可以不填）</label><input id="nick" maxlength="10" placeholder="例如：阿明、小美" value="${esc(S.p.nick||'')}"></div>
        <p class="hint">暱稱只會畫在你的圖上，不會送出，也不會存進任何資料。</p>
        <div class="row"><button class="btn" id="keepSave">儲存圖片</button><button class="btn ghost" id="keepRedo">換一套制服</button></div>
        <p class="hint" id="keepMsg" role="status">手機上也可以長按圖片儲存，再分享到 LINE 或 FB。</p>
      </div></div></div>`;
}
function bindKeepsake(){
  const draw=()=>drawKeepsake(S.p).then(url=>{ if(url) $('#keepImg').src=url; });
  $('#nick').oninput=e=>{ S.p.nick=e.target.value.trim(); draw(); };
  $('#keepRedo').onclick=()=>{ document.getElementById('wrap').classList.remove('wide'); S.editing=false; S.afterMap=true; runwayAfterMap(); };
  $('#keepSave').onclick=async()=>{
    const url=$('#keepImg').src, msg=$('#keepMsg');
    try{
      const blob=await (await fetch(url)).blob(), file=new File([blob],'壢商回娘家紀念圖.jpg',{type:'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'壢商校友線上回娘家'}); return; }
      const a=document.createElement('a'); a.href=url; a.download='壢商回娘家紀念圖.jpg'; document.body.appendChild(a); a.click(); a.remove();
      msg.textContent='如果沒有開始下載，請長按（或按右鍵）圖片另存。';
    }catch(e){ if(e&&e.name==='AbortError') return; msg.textContent='請長按（或按右鍵）圖片另存。'; }
  };
  draw();
}
// 地圖頁按「換一套制服」：只換紀念圖上的制服，換完回地圖
function runwayAfterMap(){
  runway();
  const ok=$('#rwOk'), sk=$('#rwSkip');
  ok.textContent='換好了'; if(sk){ sk.textContent='‹ 回地圖'; sk.className='backlink'; sk.onclick=backToKeepsake; }
  ok.onclick=()=>{ SFX.tada(); const d=store.get(doneKey()); if(d){ d.uniform=S.p.uniform; d.uvar=S.p.uvar; store.set(doneKey(),d); } backToKeepsake(); };
}
// 回到地圖頁時直接停在紀念圖那一區，不用再往下滑
function backToKeepsake(){ mapScreen(true); requestAnimationFrame(()=>{ const k=$('#keepCard'); if(k) window.scrollTo({top:k.getBoundingClientRect().top+scrollY-16,behavior:'auto'}); }); }

/* ---------- 問答流程 ---------- */
function next(){
  if(S.editing){
    const k=FLOW[S.step];
    if(k==='year' && S.p.dept && S.p.division!=='junior'){ const d=(CONFIG.DEPTS[S.p.division]||[]).find(d=>d[0]===S.p.dept); if(d && !((d[1]==null||S.p.year>=d[1])&&(d[2]==null||S.p.year<=d[2]))){ S.p.dept=null; S.step=FLOW.indexOf('dept'); return flow(); } }
    if(k==='division' && S.p.division!=='junior' && !S.p.dept){ S.step=FLOW.indexOf('dept'); return flow(); }
    S.editing=false; S.step=FLOW.indexOf('confirm'); return flow();
  }
  S.step++; flow();
}
const isFact = k => k && k.startsWith('fact');
function back(){ if(S.editing){ S.editing=false; S.step=FLOW.indexOf('confirm'); return flow(); }
  do{ S.step--; } while(S.step>0 && (skipStep(FLOW[S.step]) || isFact(FLOW[S.step]))); flow(); }
const BACK_LABEL='‹ 回上一題';
function skipStep(k){ return (k==='dept' && S.p.division==='junior'); }
function navRow(canNext, label='下一步'){
  return `<div class="row" style="justify-content:space-between">${(S.step>FLOW.indexOf('year')||S.editing)?`<button class="backlink" id="back">${S.editing?'‹ 取消修改':BACK_LABEL}</button>`:'<span></span>'}<button class="btn" id="next" ${canNext?'':'disabled'}>${S.editing?'改好了':label}</button></div>`;
}
function bindNav(){ const b=$('#back'); if(b) b.onclick=back; }
function classNo(){ const o=CONFIG.CLASS_OFFSET[S.p.division]; return o!=null && S.p.year-o>=1 ? S.p.year-o : null; }
function divShort(){ return S.p.division==='night'?'進修部':'日間部'; }

function flow(){
  const k=FLOW[S.step];
  if(k===undefined) return submit();
  if(skipStep(k)){ return next(); }
  setProgress(S.step, FLOW.length);
  ({ confirm:qConfirm, mood:qMood, year:qYear, division:qDivision, 'fact-era':factEra, dept:qDept, 'fact-dept':factDept, job:qJob, fact:factGeneral, region:qRegion, msg:qMsg, invite:qInvite })[k]();
}
function factCard(f, extra=''){
  show(`<section class="card fact">
    <p class="eyebrow">壢商今昔</p>
    <span class="when">${esc(f.when)}</span>
    <h2>${esc(f.title)}</h2>
    <p>${esc(f.body)}</p>${photoHTML(f.photo)}${extra}
    <button class="btn" id="next">原來如此，繼續</button>
  </section>`);
  $('#next').onclick=next;
}

function qMood(){
  show(`<section class="card">
    <p class="eyebrow">先問候一下</p>
    <h2>好久不見，你最近過得好嗎？</h2>
    <div class="opts">${CONFIG.MOODS.map((m,i)=>`<button class="opt" id="md${i}" data-i="${i}" aria-pressed="${S.p.mood===m.v}">${esc(m.v)}</button>`).join('')}</div>
    <div id="moodReply"></div>
    <div class="row" style="justify-content:space-between"><button class="linkbtn" id="skip">不想說也沒關係，跳過</button><button class="btn" id="next" ${S.p.mood?'':'disabled'}>繼續</button></div>
  </section>`);
  const say=i=>{ $('#moodReply').innerHTML=`<div class="feedback reply"><b>${esc(CONFIG.MOODS[i].reply)}</b></div>`; };
  const cur=CONFIG.MOODS.findIndex(m=>m.v===S.p.mood); if(cur>=0) say(cur);
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; S.p.mood=CONFIG.MOODS[i].v; stage.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b)); say(i); $('#next').disabled=false; });
  $('#skip').onclick=()=>{ S.p.mood=null; next(); };
  $('#next').onclick=next;
}
function qYear(){
  const opts=[]; for(let y=CONFIG.YEAR_MAX;y>=CONFIG.YEAR_MIN;y--) opts.push(`<option value="${y}" ${y===S.p.year?'selected':''}>${y}</option>`);
  show(`<section class="card">
    <p class="eyebrow">問題 1</p>
    <h2>你是民國哪一年從壢商畢業的？</h2>
    <p class="lead">不記得屆數沒關係，我們幫你算。</p>
    <div class="yearbox">
      <span>民國</span>
      <div class="stepper"><button id="ym" aria-label="減一年">−</button><select id="ysel" aria-label="畢業年（民國）">${opts.join('')}</select><button id="yp" aria-label="加一年">＋</button></div>
      <span>年</span>
      <span class="ad" id="ad"></span>
    </div>
    ${navRow(true)}
  </section>`);
  const sel=$('#ysel'), ad=$('#ad');
  const upd=()=>{ S.p.year=+sel.value; ad.textContent=`西元 ${S.p.year+1911} 年`; };
  sel.onchange=upd; upd();
  $('#ym').onclick=()=>{ if(S.p.year>CONFIG.YEAR_MIN){ sel.value=S.p.year-1; upd(); } };
  $('#yp').onclick=()=>{ if(S.p.year<CONFIG.YEAR_MAX){ sel.value=S.p.year+1; upd(); } };
  $('#next').onclick=next; bindNav();
}
function qDivision(){
  const d=CONFIG.DIVISIONS.filter(x=> x.id!=='junior' || S.p.year<=62);
  if(S.p.division==='junior' && S.p.year>62) S.p.division=null;
  show(`<section class="card">
    <p class="eyebrow">問題 2</p>
    <h2>你讀的是哪一部？</h2>
    <div class="opts">${d.map(x=>`<button class="opt" id="dv-${x.id}" data-v="${x.id}" aria-pressed="${S.p.division===x.id}"><span>${x.label}<br><small class="hint">${x.hint}</small></span></button>`).join('')}</div>

// 年輪：最裡面是最新學年度，往外越舊越淡；面積代表人數
function ringSVG(rg, cx, cy, list, maxN, maxR, label){
  const seasons=seasonsAll(); const cnt=new Map(); list.forEach(r=>cnt.set(r.s,(cnt.get(r.s)||0)+1));
  const order=seasons.filter(s=>cnt.has(s)); const total=list.length; if(!total) return '';
  // 中心圓＝最新學年度；外圈寬度依人數分配，每圈至少 2.5，確保看得見
  const c0=cnt.get(order[0]), rest=total-c0, bands=order.length-1;
  const R=Math.max(4+Math.sqrt(total/maxN)*maxR, 4+bands*3);
  const core=bands? Math.max(3, R*Math.sqrt(c0/total)) : R;
  const avail=Math.max(0,R-core), widths=order.slice(1).map(s=> rest? cnt.get(s)/rest*avail : 0);
  const fix=widths.map(w=>Math.max(2.5,w)), scale=fix.reduce((a,b)=>a+b,0)>avail&&avail>0? avail/fix.reduce((a,b)=>a+b,0):1;
  const radii=[core]; fix.forEach(w=>radii.push(radii[radii.length-1]+w*Math.max(scale, 2.5/Math.max(...fix,2.5))));
  const parts=[];
  for(let k=order.length-1;k>=0;k--){ const ci=Math.min(3,seasons.indexOf(order[k]));
    parts.push(`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${radii[k].toFixed(1)}" style="fill:var(--ring-${ci})"/>`); }
  const tip=`${label}：共 ${total} 位（`+order.map(s=>`${s}學年度 ${cnt.get(s)}`).join('、')+'）';
  return `<g class="ring ${SEL===rg?'sel':''}" data-rg="${rg}"><title>${tip}</title>${parts.join('')}</g>`;
}
function ringLegend(){ const ss=seasonsAll();
  return ss.slice(0,3).map((s,i)=>`<i style="background:var(--ring-${i});border-radius:50%;width:12px;height:12px"></i>${s}學年度`).join(' ')+(ss.length>3?` <i style="background:var(--ring-3);border-radius:50%;width:12px;height:12px"></i>更早`:''); }
function drawMap(){
  const rows=scopeRows();
  $('#sc-now').setAttribute('aria-pressed',SCOPE==='now'); $('#sc-all').setAttribute('aria-pressed',SCOPE==='all');
  drawTiles(rows);
  $('#tab-tw').setAttribute('aria-pressed',MAPTAB==='tw'); $('#tab-world').setAttribute('aria-pressed',MAPTAB==='world');
  const by=new Map(); rows.forEach(r=>{ if(!r.rg) return; if(!by.has(r.rg)) by.set(r.rg,[]); by.get(r.rg).push(r); });
  const mine=S.p.region;
  let svg='';
  if(MAPTAB==='tw'){
    const vals=CONFIG.COUNTIES.map(c=>(by.get('tw:'+c)||[]).length); const max=Math.max(1,...vals);
    const lvl=n=> n===0?0: Math.min(5, 1+Math.floor(Math.sqrt(n/max)*4.999));
    const [x,y,w,h]=GEO.tw.vb;
    const all=SCOPE==='all';
    svg=`<svg class="mapsvg" viewBox="${x} ${y} ${w} ${h}" role="img" aria-label="臺灣各縣市校友人數地圖">
      ${GEO.tw.f.map(f=>{const n=(by.get('tw:'+f.n)||[]).length;return `<path class="rg ${all?'faint':''} ${all&&n?'has':''} ${SEL==='tw:'+f.n?'sel':''}" data-rg="tw:${f.n}" d="${f.d}" ${all?'':`style="fill:var(--map-${lvl(n)})"`}><title>${f.n}：${n} 位</title></path>`}).join('')}
      ${all ? GEO.tw.f.filter(f=>by.has('tw:'+f.n)).sort((a,b)=>(by.get('tw:'+b.n).length)-(by.get('tw:'+a.n).length)).map(f=>ringSVG('tw:'+f.n,f.c[0],f.c[1],by.get('tw:'+f.n),max,20,f.n)).join('')
        : GEO.tw.f.filter(f=>(by.get('tw:'+f.n)||[]).length).map(f=>`<text class="lbl" x="${f.c[0]}" y="${f.c[1]}" text-anchor="middle">${(by.get('tw:'+f.n)||[]).length}</text>`).join('')}
      ${mine&&mine.startsWith('tw:')?(()=>{const f=GEO.tw.f.find(z=>'tw:'+z.n===mine);return f?`<circle class="me ping" cx="${f.c[0]}" cy="${f.c[1]-14}" r="9"/><circle cx="${f.c[0]}" cy="${f.c[1]-14}" r="5" style="fill:var(--seal)"/>`:''})():''}
    </svg>`;
    $('#legend').innerHTML= all ? ringLegend() : `少 ${[1,2,3,4,5].map(i=>`<i style="background:var(--map-${i})"></i>`).join('')} 多`;
  } else {
    const twRows=rows.filter(r=>r.rg&&r.rg.startsWith('tw:'));
    const pts=[{rg:'tw:*',name:'臺灣',lon:121,lat:23.7,n:twRows.length}].concat(CONFIG.COUNTRIES.filter(c=>c[2]!=null).map(c=>({rg:'xx:'+c[0],name:c[1],lon:c[2],lat:c[3],n:(by.get('xx:'+c[0])||[]).length}))).filter(p=>p.n>0);
    const max=Math.max(1,...pts.map(p=>p.n));
    const has=new Set(pts.map(p=>p.rg.split(':')[1])); has.add('TWN');
    const P=(lon,lat)=>[(lon+180)*2.2,(84-lat)*2.4];
    const [x,y,w,h]=GEO.world.vb;
    svg=`<svg class="mapsvg" viewBox="${x} ${y} ${w} ${h}" role="img" aria-label="全世界校友分布地圖">
      ${GEO.world.f.map(f=>{const rg=f.i==='TWN'?'tw:*':'xx:'+f.i; const h=has.has(f.i)&&(f.i==='TWN'||by.has(rg));return `<path class="land ${h?'has':''} ${SEL===rg?'sel':''}" ${h?`data-rg="${rg}"`:''} d="${f.d}"></path>`}).join('')}
      ${SCOPE==='all' ? pts.sort((a,b)=>b.n-a.n).map(p=>{const [cx,cy]=P(p.lon,p.lat);return ringSVG(p.rg,cx,cy,p.rg==='tw:*'?twRows:by.get(p.rg),max,18,p.name)}).join('') : pts.sort((a,b)=>b.n-a.n).map(p=>{const [cx,cy]=P(p.lon,p.lat);const r=4+Math.sqrt(p.n/max)*18;return `<circle class="bub ${SEL===p.rg||(p.rg==='tw:*'&&SEL&&SEL.startsWith('tw:'))?'sel':''}" data-rg="${p.rg}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}"><title>${p.name}：${p.n} 位</title></circle>`}).join('')}
      ${mine&&mine.startsWith('xx:')&&COUNTRY[mine.slice(3)]&&COUNTRY[mine.slice(3)][2]!=null?(()=>{const c=COUNTRY[mine.slice(3)];const [cx,cy]=P(c[2],c[3]);return `<circle class="me ping" cx="${cx}" cy="${cy}" r="10"/>`})():''}
    </svg>`;
    const oth=(by.get('xx:OTH')||[]).length;
    $('#legend').innerHTML=(SCOPE==='all'? ringLegend()+'　圈越大人越多' : `<i style="background:var(--yellow);border-radius:50%;width:12px;border:1px solid var(--green-ink)"></i> 泡泡越大人越多`)+(oth?`　其他國家 ${oth} 位`:'');
  }
  $('#map').innerHTML=svg;
  if(MAPTAB==='tw'){ const g=$('#map svg');
    ['金門縣','連江縣'].forEach(n=>{ const el=g.querySelector(`[data-rg="tw:${n}"]`); if(!el) return; const b=el.getBBox(), pad=5;
      const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
      r.setAttribute('class','inset'); r.setAttribute('x',b.x-pad); r.setAttribute('y',b.y-pad); r.setAttribute('width',b.width+pad*2); r.setAttribute('height',b.height+pad*2); r.setAttribute('rx',4);
      g.insertBefore(r,g.firstChild);
      const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('class','lbl'); t.setAttribute('x',b.x-pad); t.setAttribute('y',b.y+b.height+pad+12); t.textContent=n.slice(0,2); g.appendChild(t); }); }
  const sel=rg=>{ SEL=rg; renderInfo(); $('#map').querySelectorAll('[data-rg]').forEach(el=>el.classList.toggle('sel', el.dataset.rg===rg)); };
  $('#map').querySelectorAll('[data-rg]').forEach(el=>{ el.addEventListener('click',()=>sel(el.dataset.rg)); el.addEventListener('mouseenter',()=>{ if(matchMedia('(hover:hover)').matches) sel(el.dataset.rg); }); });
  renderInfo();
}
function renderInfo(){
  const rows=scopeRows();
  let title, rs;
  if(!SEL){ title=`全部校友（${scopeName()}）`; rs=rows; }
  else if(SEL==='tw:*'){ title='臺灣'; rs=rows.filter(r=>r.rg&&r.rg.startsWith('tw:')); }
  else if(MAPTAB==='world' && SEL.startsWith('tw:')){ title='臺灣'; rs=rows.filter(r=>r.rg&&r.rg.startsWith('tw:')); }
  else { title=`${regionName(SEL)}（${scopeName()}）`; rs=rows.filter(r=>r.rg===SEL); }
  $('#info').innerHTML=infoHTML(title, rs) + (SEL?'<button class="linkbtn" id="all" style="align-self:flex-start">看全部校友</button>':'');
  const a=$('#all'); if(a) a.onclick=()=>{ SEL=null; drawMap(); };
}

if(!LIVE) $('#demoNote').hidden=false;
welcome();
</script>
